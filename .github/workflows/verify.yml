name: Verify paper
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete computational audit
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quick:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify.py --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-report-${{ matrix.os }}
          path: .build/verification/
          retention-days: 14
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Tectonic
        shell: bash
        run: |
          curl --fail --location --output "$RUNNER_TEMP/tectonic.tar.gz" https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz
          echo "1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python tools/build_paper.py
      - uses: actions/upload-artifact@v4
        with:
          name: paper-build
          path: .build/paper/
          retention-days: 14
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify.py --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-report
          path: .build/verification/
          retention-days: 14
